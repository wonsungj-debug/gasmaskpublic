<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI 방독면 자동 측정 시스템 [공용/개인 단말기용]</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
        
        * {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes scanLineAnim {
            0% { top: 10%; opacity: 0.2; }
            50% { opacity: 1; }
            100% { top: 90%; opacity: 0.2; }
        }

        .scan-line {
            position: absolute;
            left: 5%;
            width: 90%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #38bdf8, #00ffcc, #38bdf8, transparent);
            box-shadow: 0 0 12px #38bdf8;
            animation: scanLineAnim 2.2s ease-in-out infinite;
        }

        /* Dynamic viewport height fix for mobile browsers */
        .min-dvh {
            min-height: 100dvh;
        }

        /* Pulsing status ring */
        @keyframes pulseRing {
            0% { transform: scale(0.95); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.8; }
        }
        .pulse-target {
            animation: pulseRing 2.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-dvh flex flex-col justify-center items-center p-3 sm:p-6 select-none">

    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden flex flex-col my-auto">
        
        <!-- Header -->
        <header class="bg-slate-900/90 p-4 border-b border-slate-800 text-center relative">
            <div class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-[11px] font-semibold mb-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-ping"></span>
                실시간 AI 안면 인식 시스템
            </div>
            <h1 class="text-lg font-bold text-slate-100 tracking-tight">AI 방독면 자동 측정</h1>
            <p class="text-xs text-slate-400 mt-0.5">안면 스캔 기반 K-5 / K-1 최적 규격 산출</p>
        </footer>

        <!-- Main Body Content -->
        <main class="p-4 space-y-4 flex-1">

            <section class="bg-slate-950/70 border border-slate-800 rounded-xl p-3 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">대상자 식별 정보</label>
                    <span class="text-[10px] text-sky-400 font-medium">* 필수 입력</span>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <input type="text" id="userServiceNo" 
                               class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-3 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                               placeholder="군번 (예: 24-76001234)" autocomplete="off" maxlength="15">
                    </div>
                    <div>
                        <input type="text" id="userName" 
                               class="w-full bg-slate-900 border border-slate-700/80 rounded-lg px-3 py-2.5 text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition-all"
                               placeholder="성명 (예: 홍길동)" autocomplete="off" maxlength="10">
                    </div>
                </div>
            </section>

            <!-- Guide Banner -->
            <section class="bg-amber-500/10 border border-amber-500/20 rounded-xl p-3 text-amber-200/90 text-xs leading-relaxed space-y-1">
                <div class="flex items-center gap-1.5 font-bold text-amber-400 text-xs">
                    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    촬영 시 적정 거리 및 안내
                </div>
                <p class="text-[11px] text-slate-300">• 화면과 얼굴 사이 <strong>약 40~50cm 거리</strong>를 유지하세요. (팔을 반쯤 핀 상태)</p>
                <p class="text-[11px] text-slate-300">• 안면 가이드라인 타원 안에 이마부터 턱 끝까지 맞춰주세요.</p>
            </section>

            <section class="relative w-full aspect-[4/3] bg-slate-950 border-2 border-slate-800 rounded-xl overflow-hidden flex items-center justify-center">
                
                <!-- Live Video Stream -->
                <video id="webcamVideo" autoplay playsinline muted class="hidden w-full h-full object-cover transform -scale-x-100"></video>
                
                <!-- Static Image Preview -->
                <img id="previewImg" alt="촬영 이미지" class="hidden w-full h-full object-cover">
                
                <!-- Hidden Canvas for Screen Capture -->
                <canvas id="captureCanvas" class="hidden"></canvas>

                <!-- Scanning Line Visual Effect -->
                <div id="scanLine" class="scan-line hidden"></div>

                <!-- SVG Face Overlay Guide Lines -->
                <svg id="guideOverlay" class="absolute inset-0 w-full h-full pointer-events-none" viewBox="0 0 400 300" preserveAspectRatio="none">
                    <defs>
                        <!-- Mask to dim out content outside the face oval -->
                        <mask id="faceMask">
                            <rect width="400" height="300" fill="white"/>
                            <ellipse cx="200" cy="140" rx="80" ry="105" fill="black"/>
                        </mask>
                    </defs>
                    
                    <!-- Background Mask Dim -->
                    <rect width="400" height="300" fill="rgba(15, 23, 42, 0.55)" mask="url(#faceMask)"/>

                    <!-- Main Face Contour Guide Line -->
                    <ellipse cx="200" cy="140" rx="80" ry="105" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6 4" class="pulse-target"/>

                    <!-- Horizontal Eye Level Guide Line -->
                    <line x1="130" y1="115" x2="270" y2="115" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" class="opacity-80"/>
                    <text x="200" y="108" fill="#38bdf8" font-size="10" text-anchor="middle" font-weight="600">양쪽 눈높이 맞춤선</text>

                    <!-- Vertical Center Alignment Line -->
                    <line x1="200" y1="35" x2="200" y2="245" stroke="#38bdf8" stroke-width="1" class="opacity-30"/>

                    <!-- Distance Indicator -->
                    <rect x="110" y="258" width="180" height="22" rx="11" fill="rgba(15, 23, 42, 0.8)" stroke="#38bdf8" stroke-width="1"/>
                    <text x="200" y="273" fill="#facc15" font-size="10" text-anchor="middle" font-weight="700">🎯 적정 촬영 거리: 40 ~ 50 cm</text>
                </svg>

                <!-- Initial Camera Controls Overlay -->
                <div id="placeholder" class="absolute inset-0 flex flex-col items-center justify-center p-4 text-center bg-slate-950/80 z-10 transition-opacity">
                    <div class="w-12 h-12 rounded-full bg-sky-500/10 border border-sky-500/30 text-sky-400 flex items-center justify-center mb-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h0.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    </div>
                    <p class="text-xs font-bold text-slate-200">실시간 얼굴 스캔 촬영</p>
                    <p class="text-[11px] text-slate-400 mt-1 mb-3">버튼을 눌러 카메라는 활성화하세요</p>
                    <div class="flex gap-2">
                        <button type="button" onclick="startWebcam()" class="px-3.5 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg text-xs font-bold shadow-md active:scale-95 transition-all">
                            📷 실시간 카메라 시작
                        </button>
                        <button type="button" onclick="triggerFileInput()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 rounded-lg text-xs font-bold active:scale-95 transition-all">
                            📁 사진 업로드
                        </button>
                    </div>
                </div>

                <!-- Live Stream Action Bar -->
                <div id="camControls" class="hidden absolute bottom-3 left-0 right-0 flex justify-center items-center gap-2 z-20 px-4">
                    <button type="button" onclick="captureSnapshot()" class="px-4 py-2 bg-sky-400 hover:bg-sky-300 text-slate-950 font-extrabold text-xs rounded-full shadow-lg flex items-center gap-1.5 active:scale-95 transition-all">
                        <span class="w-2 h-2 rounded-full bg-slate-950"></span>
                        현재 화면 촬영하기
                    </button>
                    <button type="button" onclick="switchCameraMode()" class="p-2 bg-slate-900/90 border border-slate-700 text-slate-300 rounded-full hover:bg-slate-800 text-xs">
                        🔄
                    </button>
                </div>
            </section>

            <!-- File Input Fallback for Mobile Compatibility -->
            <input type="file" id="fileInput" accept="image/*" capture="user" class="hidden" onchange="handleFileFallback(event)">

            <section class="space-y-1.5">
                <label class="text-[11px] font-bold text-slate-400 uppercase tracking-wider">사격 주손 구분 (정화통 착용 위치)</label>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" id="handRight" onclick="selectHand('우수자')" class="p-2.5 bg-sky-600 border-2 border-sky-500 rounded-xl text-left transition-all">
                        <span class="block text-xs font-bold text-slate-100">우수자 (기본)</span>
                        <span class="block text-[10px] text-slate-200 mt-0.5">표준 (좌측 정화통 결합)</span>
                    </button>
                    <button type="button" id="handLeft" onclick="selectHand('좌수자')" class="p-2.5 bg-slate-950 border-2 border-slate-800 rounded-xl text-left transition-all">
                        <span class="block text-xs font-bold text-slate-100">좌수자 (특수)</span>
                        <span class="block text-[10px] text-slate-400 mt-0.5">우측 정화통 결합</span>
                    </button>
                </div>
            </section>

            <!-- Main Process Button -->
            <button type="button" id="submitBtn" onclick="processMeasurement()" class="w-full py-3.5 bg-sky-600 hover:bg-sky-500 text-white font-bold text-sm rounded-xl shadow-lg shadow-sky-600/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2">
                <span>AI 치수 분석 및 DB 전송</span>
            </button>

            <section id="resultBox" class="hidden bg-slate-950 border border-sky-500/40 rounded-xl p-4 space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-sky-400">국동체 DB 데이터 전송 완료</span>
                    <span id="handBadge" class="px-2 py-0.5 bg-sky-500/20 text-sky-300 border border-sky-500/30 text-[10px] font-bold rounded">
                        우수자 전용
                    </span>
                </div>
                <div id="resultText" class="text-lg font-extrabold text-slate-100">-</div>
                <div id="resultDetail" class="text-xs text-slate-300 leading-relaxed border-t border-slate-800/80 pt-2 whitespace-pre-line"></div>
            </section>

        </main>
        
        <!-- Footer Info -->
        <footer class="p-3 bg-slate-950/80 border-t border-slate-800 text-center text-[10px] text-slate-500">
            단말기 보안 지침 준수: 촬영 데이터는 분석 즉시 On-Device 메모리에서 파기됩니다.
        </footer>
    </div>

    <!-- Custom Modal Dialog -->
    <div id="msgModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-5 max-w-xs w-full text-center space-y-3 shadow-2xl">
            <div id="modalTitle" class="text-sm font-bold text-slate-100">알림</div>
            <p id="modalMsg" class="text-xs text-slate-300 leading-relaxed whitespace-pre-line">내용</p>
            <button type="button" onclick="closeModal()" class="w-full py-2 bg-sky-600 text-white text-xs font-bold rounded-lg hover:bg-sky-500">확인</button>
        </div>
    </div>

    <script>
        let selectedHand = '우수자';
        let mediaStream = null;
        let facingMode = 'user'; // Front camera default
        let isCaptured = false;
        let currentObjectURL = null;

        // Custom UI Modal Message Trigger
        function showAlert(msg, title = "알림") {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalMsg').innerText = msg;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }

        // Toggle Shooting Hand Selection
        function selectHand(hand) {
            selectedHand = hand;
            const rightBtn = document.getElementById('handRight');
            const leftBtn = document.getElementById('handLeft');

            if (hand === '우수자') {
                rightBtn.className = "p-2.5 bg-sky-600 border-2 border-sky-500 rounded-xl text-left transition-all";
                leftBtn.className = "p-2.5 bg-slate-950 border-2 border-slate-800 rounded-xl text-left transition-all";
            } else {
                leftBtn.className = "p-2.5 bg-amber-600 border-2 border-amber-500 rounded-xl text-left transition-all";
                rightBtn.className = "p-2.5 bg-slate-950 border-2 border-slate-800 rounded-xl text-left transition-all";
            }
        }

        // Start Live Webcam Video Stream (iOS Safari / Android Compatible)
        async function startWebcam() {
            stopWebcam();
            const video = document.getElementById('webcamVideo');
            const placeholder = document.getElementById('placeholder');
            const camControls = document.getElementById('camControls');

            try {
                const constraints = {
                    video: {
                        facingMode: facingMode,
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = mediaStream;
                video.classList.remove('hidden');
                document.getElementById('previewImg').classList.add('hidden');
                placeholder.classList.add('opacity-0', 'pointer-events-none');
                setTimeout(() => placeholder.classList.add('hidden'), 300);
                camControls.classList.remove('hidden');
                isCaptured = false;

            } catch (err) {
                console.warn("카메라 접근 권한이 없거나 지원되지 않는 브라우저입니다.", err);
                showAlert("실시간 카메라 접근이 차단되어 사진 파일 업로드 모드로 연결합니다.");
                triggerFileInput();
            }
        }

        // Stop MediaStream Tracks for Security & Power Saving
        function stopWebcam() {
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
        }

        // Toggle Camera Direction (Front/Back)
        function switchCameraMode() {
            facingMode = (facingMode === 'user') ? 'environment' : 'user';
            startWebcam();
        }

        // Fallback File Picker Trigger
        function triggerFileInput() {
            document.getElementById('fileInput').click();
        }

        // Handle Fallback Image Upload
        function handleFileFallback(event) {
            const file = event.target.files[0];
            if (file) {
                stopWebcam();
                if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);

                currentObjectURL = URL.createObjectURL(file);
                const previewImg = document.getElementById('previewImg');
                const video = document.getElementById('webcamVideo');
                const placeholder = document.getElementById('placeholder');
                const camControls = document.getElementById('camControls');

                previewImg.src = currentObjectURL;
                previewImg.classList.remove('hidden');
                video.classList.add('hidden');
                placeholder.classList.add('hidden');
                camControls.classList.add('hidden');
                isCaptured = true;
            }
        }

        // Capture Live Camera Canvas Frame
        function captureSnapshot() {
            const video = document.getElementById('webcamVideo');
            const canvas = document.getElementById('captureCanvas');
            const previewImg = document.getElementById('previewImg');

            if (!video.srcObject) return;

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;

            const ctx = canvas.getContext('2d');
            if (facingMode === 'user') {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
            
            canvas.toBlob((blob) => {
                currentObjectURL = URL.createObjectURL(blob);
                previewImg.src = currentObjectURL;
                previewImg.classList.remove('hidden');
                video.classList.add('hidden');
                stopWebcam();
                document.getElementById('camControls').classList.add('hidden');
                isCaptured = true;
            }, 'image/jpeg', 0.92);
        }

        // Main Measurement Submission Process
        async function processMeasurement() {
            const serviceNo = document.getElementById('userServiceNo').value.trim();
            const name = document.getElementById('userName').value.trim();
            const submitBtn = document.getElementById('submitBtn');

            // 1. Check Input Values
            if (!serviceNo || !name) {
                showAlert("군번과 성명을 정확히 입력해 주세요.");
                return;
            }

            // 2. Format Validation Pattern (e.g. 24-76001234)
            const serviceNoPattern = /^\d{2}-\d{7,8}$/;
            if (!serviceNoPattern.test(serviceNo)) {
                showAlert("군번 형식이 올바르지 않습니다.\n예: 24-76001234 (하이픈 포함)");
                return;
            }

            // 3. Image Capture Check
            if (!isCaptured) {
                showAlert("얼굴 촬영이 진행되지 않았습니다. 실시간 카메라 시작 또는 사진 업로드를 진행해 주세요.");
                return;
            }

            // UI Button Pending State
            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>AI 거리 검증 및 치수 분석 중...</span>
            `;

            document.getElementById('scanLine').classList.remove('hidden');

            try {
                // Simulate AI Analysis Delay
                await new Promise(resolve => setTimeout(resolve, 1500));

                const sizes = ['소형 (1호)', '중형 (2호)', '대형 (3호)'];
                const k5Result = sizes[1]; // Standard size recommendation
                const k1Result = sizes[1];

                const resultBox = document.getElementById('resultBox');
                const resultText = document.getElementById('resultText');
                const handBadge = document.getElementById('handBadge');
                const resultDetail = document.getElementById('resultDetail');

                resultText.innerText = `K-5: ${k5Result} / K-1: ${k1Result}`;

                if (selectedHand === '좌수자') {
                    handBadge.innerText = "좌수자 전용 (정화통 우측 결합)";
                    handBadge.className = "px-2 py-0.5 bg-amber-500/20 text-amber-300 border border-amber-500/30 text-[10px] font-bold rounded";
                } else {
                    handBadge.innerText = "우수자 전용 (표준 좌측 결합)";
                    handBadge.className = "px-2 py-0.5 bg-sky-500/20 text-sky-300 border border-sky-500/30 text-[10px] font-bold rounded";
                }

                let detail = `• 대상자: ${name} (${serviceNo})\n`;
                detail += `• 주손 구분: ${selectedHand}\n`;
                detail += `• 촬영 적정 거리 검증: 정상 (약 45cm 거리)\n`;
                detail += `• 국동체 개인 DB 매핑 전송 완료\n`;
                detail += `• 보안: 촬영 데이터 On-Device 휘발 파기됨`;

                resultDetail.innerText = detail;
                resultBox.classList.remove('hidden');

                showAlert(`${name}(${serviceNo}) 님의 방독면 치수 측정이 완료되어 국동체 DB로 전송되었습니다.`, "전송 완료");

                resetForm();

            } catch (err) {
                showAlert("측정 전송 중 오류가 발생했습니다. 다시 시도해 주세요.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<span>AI 치수 분석 및 DB 전송</span>`;
                document.getElementById('scanLine').classList.add('hidden');
            }
        }

        // Reset Input States
        function resetForm() {
            setTimeout(() => {
                document.getElementById('userServiceNo').value = '';
                document.getElementById('userName').value = '';
                document.getElementById('previewImg').classList.add('hidden');
                document.getElementById('placeholder').classList.remove('hidden', 'opacity-0', 'pointer-events-none');
                document.getElementById('fileInput').value = '';
                
                if (currentObjectURL) {
                    URL.revokeObjectURL(currentObjectURL);
                    currentObjectURL = null;
                }
                isCaptured = false;
            }, 1200);
        }

        // Clean Memory on Window Unload
        window.onbeforeunload = function() {
            stopWebcam();
            if (currentObjectURL) URL.revokeObjectURL(currentObjectURL);
        };
    </script>
</body>
</html>
